providers = ["php"]

[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"

[phases.setup]
nixPkgs = [
  "php83",
  "php83Packages.composer",
  "php83Extensions.pdo_mysql",
  "php83Extensions.bcmath",
  "php83Extensions.gd",
  "php83Extensions.intl",
  "php83Extensions.zip",
  "php83Extensions.exif",
  "php83Extensions.pcntl",
  "php83Extensions.opcache",
  "php83Extensions.fileinfo",
]

[phases.install]
cmds = [
  "composer install --no-dev --no-interaction --no-scripts --prefer-dist --optimize-autoloader",
]

[phases.build]
cmds = [
  "composer dump-autoload --optimize --no-dev",
  "mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache",
  "chmod -R ug+rwX storage bootstrap/cache",
]

# Coolify reads this. Override per-service by setting CONTAINER_ROLE in env.
#   web       (default) → migrate + caches + php-fpm/nginx via nixpacks
#   reverb    → starts the WebSocket server
#   queue     → runs the queue worker
[start]
cmd = "sh -c 'ROLE=${CONTAINER_ROLE:-web}; if [ \"$ROLE\" = \"reverb\" ]; then exec php artisan reverb:start --host=0.0.0.0 --port=${REVERB_SERVER_PORT:-8080}; elif [ \"$ROLE\" = \"queue\" ]; then exec php artisan queue:work --tries=3 --timeout=90 --sleep=3; else php artisan storage:link || true; php artisan migrate:fresh --seed --force --no-interaction || true; php artisan config:cache; php artisan route:cache; php artisan view:cache; exec php -d upload_max_filesize=20M -d post_max_size=32M artisan serve --host=0.0.0.0 --port=${PORT:-8000}; fi'"
